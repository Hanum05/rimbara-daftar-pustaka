RIMBARA: Penjelasan Permasalahan, Komponen, dan Material Berdasarkan Sumber Ilmiah
1. Permasalahan kebakaran lahan gambut
Referensi 1 — Alexandra, Herdiansyah, dan Yulianto (2026)
Judul: Peat Fires in Indonesia: A Socio-Ecological Synthesis Based on a Literature Review of Management Approaches
Tautan sumber: https://doi.org/10.7226/jtfm.32.2.147
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa kebakaran gambut di Indonesia berkaitan dengan berbagai faktor, termasuk drainase, penebangan, perubahan penggunaan lahan, serta degradasi ekosistem gambut. Penelitian ini meninjau berbagai pendekatan pengelolaan kebakaran dan menekankan pentingnya kombinasi solusi teknis, pembasahan kembali lahan (rewetting), revegetasi, partisipasi masyarakat, dan kolaborasi berbagai pihak. Kajian tersebut juga menunjukkan perlunya evaluasi dampak jangka panjang agar upaya pengendalian kebakaran tidak hanya berfokus pada penanganan sesaat. 
Kaitannya dengan permasalahan RIMBARA
Informasi tersebut menjadi dasar bahwa penanganan kebakaran gambut membutuhkan pendekatan yang tidak hanya berorientasi pada pemadaman, tetapi juga pemantauan kondisi lahan dan pengelolaan air. RIMBARA dirancang sebagai teknologi pendukung untuk memantau perubahan suhu di bawah permukaan gambut dan kondisi distribusi air. Data dari sensor dapat membantu petugas menentukan titik yang perlu diperiksa lebih lanjut. Namun, RIMBARA tidak menggantikan upaya pembasahan kembali lahan, restorasi hidrologi, atau pengelolaan ekosistem gambut secara menyeluruh.
Daftar pustaka
Alexandra, P. C., Herdiansyah, H., &amp; Yulianto. (2026). Peat fires in Indonesia: A socio-ecological synthesis based on a literature review of management approaches. Jurnal Manajemen Hutan Tropika, 32(2), 147–162. https://doi.org/10.7226/jtfm.32.2.147
Referensi 2 — Rein (2021), Smouldering Wildfires in Peatlands, Forests and the Arctic: Challenges and Perspectives
Tautan sumber: https://doi.org/10.1016/j.coesh.2021.100296
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa kebakaran dapat berlangsung melalui dua proses utama, yaitu pembakaran dengan nyala api (flaming combustion) dan pembakaran membara (smouldering combustion). Pembakaran membara dapat berlangsung tanpa nyala api yang jelas dan tetap mengonsumsi bahan bakar organik. Pada lahan gambut, proses tersebut dapat berlangsung dalam waktu lama, sulit dideteksi, serta menghasilkan emisi gas dan partikel pencemar. Hilangnya nyala api di permukaan juga tidak selalu menandakan bahwa proses pembakaran telah berhenti. 
Kaitannya dengan permasalahan RIMBARA
Temuan ini menjelaskan alasan ilmiah mengapa deteksi suhu di bawah permukaan menjadi salah satu fitur penting RIMBARA. Pengamatan visual saja berpotensi tidak mengenali titik panas yang masih bertahan di dalam gambut. Termokopel tipe K pada kedalaman pengamatan tertentu dapat memberikan data temperatur yang membantu mengidentifikasi anomali termal. Data tersebut perlu dibandingkan dengan kondisi dasar tanah dan dikonfirmasi menggunakan indikator lain karena peningkatan suhu tidak selalu disebabkan oleh kebakaran.
Daftar pustaka
Rein, G. (2021). Smouldering wildfires in peatlands, forests and the Arctic: Challenges and perspectives. Current Opinion in Environmental Science &amp; Health, 24, 100296. https://doi.org/10.1016/j.coesh.2021.100296
Referensi 3 — Syaufina (2016), Status of Peatland Fire Research in Indonesia
Tautan sumber: https://doi.org/10.29244/j-siltrop.7.3.S64-S67
Penjelasan isi sumber
Pada sumber ini dijelaskan perkembangan penelitian kebakaran gambut di Indonesia, termasuk kajian karakteristik kebakaran, perilaku api, penyebab kebakaran, dampak terhadap gambut dan keanekaragaman hayati, pemetaan wilayah rawan, serta estimasi luas lahan terbakar. Penelitian tersebut juga membahas kaitan kebakaran gambut dengan pencemaran kabut asap lintas wilayah dan dampak sosial, ekonomi, serta lingkungan. 
image
Journal of Tropical Silviculture
Kaitannya dengan permasalahan RIMBARA
Sumber ini mendukung pentingnya pengembangan pemantauan yang dapat menghubungkan kondisi fisik di lapangan dengan informasi lokasi. Karena itu, RIMBARA menggabungkan sensor suhu, sensor aliran, sensor tekanan, serta sistem komunikasi jarak jauh. Jika data dari sejumlah perangkat ditempatkan pada peta, petugas dapat membandingkan kondisi antartitik dan memprioritaskan lokasi yang memerlukan pemeriksaan.
Fitur pemetaan tersebut merupakan rancangan pengembangan RIMBARA, bukan hasil yang telah dibuktikan oleh penelitian Syaufina. Pengujian lapangan tetap diperlukan untuk menentukan apakah pemantauan tersebut benar-benar meningkatkan kecepatan deteksi atau efektivitas respons.
Daftar pustaka
Syaufina, L. (2016). Status of peatland fire research in Indonesia. Jurnal Silvikultur Tropika, 7(3), S64–S67. https://doi.org/10.29244/j-siltrop.7.3.S64-S67
2. Komponen elektronik dan sistem pemantauan
Referensi 4 — Espressif Systems, ESP32 Series Datasheet
Tautan sumber: https://www.espressif.com/documentation/esp32_datasheet_en.pdf
Penjelasan isi sumber
Pada sumber ini dijelaskan spesifikasi teknis keluarga mikrokontroler ESP32, termasuk kemampuan pemrosesan, antarmuka komunikasi, GPIO, Wi-Fi, Bluetooth, dan karakteristik konsumsi daya. Fitur tersebut memungkinkan ESP32 menerima sinyal dari perangkat eksternal, mengolah data, dan menjalankan program kendali sesuai rancangan pengembang.
Kaitannya dengan komponen RIMBARA
ESP32 dipilih sebagai pusat pemrosesan data. Mikrokontroler menerima hasil pengukuran suhu dari modul MAX6675, membaca pulsa sensor aliran, membaca sinyal sensor tekanan, lalu memeriksa apakah data berada dalam rentang operasi yang telah ditentukan. Setelah itu, data dapat dikirim melalui modul LoRa menuju gateway.
Dasar material secara kimia
Chip ESP32 menggunakan teknologi semikonduktor berbasis silikon. Sifat listrik silikon dapat dikendalikan melalui proses doping, yaitu penambahan sejumlah kecil unsur tertentu untuk mengubah karakteristik pembawa muatan. Pengendalian tersebut memungkinkan terbentuknya transistor yang digunakan untuk menjalankan operasi logika dan pemrosesan data.
Papan rangkaian elektronik juga umumnya menggunakan substrat laminat resin epoksi berpenguat serat kaca, dengan jalur tembaga sebagai penghantar listrik. Resin dan serat kaca memberikan dukungan struktural serta isolasi, sedangkan tembaga menghantarkan arus di antara komponen.
Alasan pemilihan untuk RIMBARA
ESP32 sesuai untuk prototipe karena menyediakan berbagai antarmuka komunikasi dalam satu perangkat. Namun, mikrokontroler ini harus ditempatkan dalam kompartemen yang terlindung dari air dan panas. Papan pengembangan biasa tidak otomatis tahan air atau memiliki ketahanan temperatur yang sesuai untuk ditanam di dalam tanah.
Daftar pustaka
Espressif Systems. (n.d.). ESP32 series datasheet. https://www.espressif.com/documentation/esp32_datasheet_en.pdf
Referensi 5 — Analog Devices, MAX6675 Cold-Junction-Compensated K-Thermocouple-to-Digital Converter
Tautan sumber: https://www.analog.com/en/products/max6675.html
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa MAX6675 merupakan rangkaian konverter yang menerima sinyal dari termokopel tipe K, melakukan kompensasi sambungan dingin (cold-junction compensation), dan mengubah sinyal menjadi data digital. Perangkat ini memiliki resolusi 12 bit, antarmuka SPI, serta rentang konversi suhu dari 0 hingga 1024 °C. Datasheet juga mencantumkan karakteristik akurasi yang perlu diperhatikan ketika merancang sistem pengukuran. 
Kaitannya dengan komponen RIMBARA
MAX6675 digunakan untuk membaca sinyal listrik yang dihasilkan termokopel tipe K. Tanpa rangkaian konversi, sinyal termoelektrik dari termokopel perlu diperkuat, dikompensasi, dan diubah menjadi data yang dapat dibaca mikrokontroler. MAX6675 mengintegrasikan fungsi tersebut sehingga mempermudah pengembangan prototipe.
Dasar kimia dan material secara rinci
Termokopel tipe K terdiri atas dua paduan logam berbeda, yaitu Chromel dan Alumel. Chromel merupakan paduan berbasis nikel-kromium, sedangkan Alumel merupakan paduan berbasis nikel yang mengandung aluminium dan unsur paduan lain. Kedua paduan menghasilkan respons termoelektrik berbeda ketika mengalami perbedaan suhu.
Perbedaan tersebut menimbulkan tegangan yang berkaitan dengan perbedaan temperatur antara sambungan pengukuran dan sambungan referensi. Secara sederhana, prinsip ini dikenal sebagai efek Seebeck. MAX6675 kemudian mengolah tegangan tersebut menjadi nilai temperatur.
Alasan pemilihan untuk RIMBARA
Termokopel tipe K dapat digunakan untuk memantau titik pengamatan yang berpotensi mengalami peningkatan temperatur lebih tinggi daripada kondisi tanah normal. Rentang pengukurannya yang luas menjadikannya kandidat untuk pengamatan termal pada prototipe.
Namun, batas suhu seluruh rakitan ditentukan oleh komponen yang paling membatasi. Walaupun MAX6675 mendukung pembacaan hingga 1024 °C, angka tersebut tidak berarti probe, kabel, konektor, atau selubungnya otomatis aman pada suhu yang sama. Selain itu, MAX6675 tidak dapat mengukur suhu negatif, sehingga batasan ini harus dipertimbangkan dalam pengujian.
Daftar pustaka
Analog Devices. (2021). MAX6675: Cold-junction-compensated K-thermocouple-to-digital converter (0°C to +1024°C) datasheet. https://www.analog.com/en/products/max6675.html
Referensi 6 — Analog Devices, DS18B20 Programmable Resolution 1-Wire Digital Thermometer
Tautan sumber: https://www.analog.com/en/products/ds18b20.html
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa DS18B20 merupakan sensor temperatur digital yang menggunakan komunikasi 1-Wire. Sensor tersebut menyediakan data suhu digital dan memiliki rentang pengukuran sekitar −55 hingga +125 °C, sehingga dapat digunakan untuk pengukuran temperatur pada berbagai aplikasi yang masih berada dalam batas operasinya.
Kaitannya dengan komponen RIMBARA
DS18B20 dapat berfungsi sebagai sensor suhu tambahan untuk mengamati zona yang relatif lebih dingin, seperti suhu lingkungan atau titik tanah yang tidak diperkirakan mengalami temperatur ekstrem. Data tersebut dapat dibandingkan dengan hasil pengukuran termokopel untuk membantu memahami perbedaan temperatur antartitik.
Dasar kimia dan material
DS18B20 menggunakan rangkaian semikonduktor yang menghasilkan data terkait temperatur. Pada produk berbentuk probe tahan air, elemen sensor biasanya dilindungi selubung logam, sedangkan kabel dilengkapi isolasi polimer. Namun, bahan dan kualitas rakitan berbeda menurut produsen.
Alasan pemilihan untuk RIMBARA
Komunikasi digital mempermudah pengumpulan data suhu tambahan. Akan tetapi, sensor ini tidak tepat dijadikan satu-satunya sensor pada titik yang mungkin mengalami temperatur jauh di atas 125 °C. Untuk zona tersebut, termokopel tipe K dengan probe dan kabel yang sesuai lebih layak dievaluasi.
Daftar pustaka
Analog Devices. (n.d.). DS18B20: Programmable resolution 1-Wire digital thermometer. https://www.analog.com/en/products/ds18b20.html
Referensi 7 — NXP Semiconductors, MPX5700 Integrated Silicon Pressure Sensor
Tautan sumber: https://www.nxp.com/products/MPX5700G
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa keluarga MPX5700 merupakan sensor tekanan berbasis silikon dengan pengondisian sinyal, kompensasi temperatur, dan kalibrasi yang terintegrasi. Varian MPX5700 memiliki rentang nominal hingga sekitar 700 kPa, tetapi tipe pengukuran dan konfigurasi tekanan harus disesuaikan dengan varian produk yang digunakan. NXP juga menyediakan dokumentasi mengenai kompatibilitas media untuk sensor tekanan berbasis silikon. 
Kaitannya dengan komponen RIMBARA
Sensor tekanan digunakan untuk mengetahui tekanan pada jalur distribusi air. Ketika sistem bekerja, tekanan yang terukur dapat membantu mengevaluasi apakah aliran berlangsung sesuai kondisi yang diharapkan. Penurunan tekanan dapat menunjukkan kemungkinan kebocoran atau gangguan suplai, sedangkan tekanan yang meningkat dapat mengindikasikan hambatan pada jalur air. Interpretasi tersebut harus mempertimbangkan karakteristik pompa, posisi sensor, dan debit.
Dasar kimia dan material
Sensor tekanan berbasis silikon umumnya memanfaatkan efek piezoresistif. Ketika tekanan menyebabkan deformasi pada elemen pengukur, hambatan listriknya berubah. Perubahan tersebut kemudian dikonversi menjadi sinyal yang berhubungan dengan tekanan.
Alasan pemilihan untuk RIMBARA
MPX5700 berpotensi digunakan apabila rentang tekanannya sesuai dengan kebutuhan alat. Akan tetapi, keluarga sensor ini tidak boleh langsung diasumsikan kompatibel dengan kontak air secara langsung. Varian, konfigurasi port, dan kompatibilitas media harus diperiksa sebelum dipasang. Jika tidak sesuai, gunakan sensor tekanan khusus cairan dengan material pembasah yang kompatibel.
Daftar pustaka
NXP Semiconductors. (n.d.). MPX5700G: 0 to 700 kPa, 5.0 V, differential/gauge/absolute pressure sensor. https://www.nxp.com/products/MPX5700G
Referensi 8 — Semtech, SX1278 LoRa Connect Transceiver
Tautan sumber: https://www.semtech.com/products/wireless-rf/lora-connect/sx1278
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa SX1278 merupakan transceiver radio yang mendukung modulasi LoRa serta beberapa format modulasi lain. Perangkat ini dirancang untuk komunikasi jarak jauh dengan konsumsi daya penerimaan yang relatif rendah. Kinerja komunikasi bergantung pada konfigurasi radio, antena, kondisi lingkungan, dan pengaturan jaringan. 
Kaitannya dengan komponen RIMBARA
SX1278 digunakan untuk mengirim data suhu, debit, tekanan, status perangkat, dan informasi lain dari unit pemantauan menuju gateway. Data dari gateway kemudian dapat diteruskan ke dashboard agar petugas tidak perlu selalu memeriksa setiap perangkat secara langsung.
Dasar kimia dan material
Transceiver tersusun atas rangkaian semikonduktor, jalur konduktor, komponen pasif, dan antena. Silikon digunakan dalam komponen semikonduktor untuk mengolah serta menghasilkan sinyal radio. Tembaga pada jalur sirkuit dan antena membantu menghantarkan arus listrik serta memancarkan atau menerima gelombang elektromagnetik.
Alasan pemilihan untuk RIMBARA
LoRa sesuai untuk prototipe pemantauan berkala yang membutuhkan pengiriman data dengan konsumsi energi relatif rendah. Akan tetapi, SX1278 tidak otomatis menyediakan akses internet atau dashboard. Sistem tetap membutuhkan penerima kompatibel, gateway, dan mekanisme penerusan data.
Penempatan antena juga perlu diperhatikan karena badan logam yang tertanam dapat menghalangi atau melemahkan sinyal. Frekuensi dan konfigurasi radio harus mengikuti ketentuan yang berlaku di Indonesia.
Daftar pustaka
Semtech Corporation. (n.d.). SX1278 LoRa Connect transceiver. https://www.semtech.com/products/wireless-rf/lora-connect/sx1278
3. Komponen pengatur aliran air dan sumber daya
Referensi 9 — YF-S201, Sensor Aliran Air Berbasis Efek Hall
Tautan sumber: [Dokumentasi dan pencarian datasheet YF-S201](https://www.google.com/search?q=YF-S201+water+flow+sensor+datasheet&amp;utm_source=chatgpt.com)
Penjelasan isi sumber
Pada dokumentasi teknis YF-S201 yang umum tersedia, sensor ini dijelaskan sebagai sensor aliran air yang menggunakan rotor internal dengan magnet dan sensor Hall. Ketika air melewati badan sensor, rotor berputar dan menghasilkan pulsa listrik yang frekuensinya berkaitan dengan laju aliran. Jumlah pulsa dalam interval waktu tertentu dapat dikonversi menjadi perkiraan volume atau debit setelah sensor dikalibrasi.
Kaitannya dengan komponen RIMBARA
YF-S201 digunakan untuk memeriksa apakah air benar-benar mengalir melalui jalur distribusi. Informasi ini penting karena perintah membuka katup tidak selalu menjamin air telah mencapai titik keluaran. Sensor aliran memungkinkan sistem membandingkan kondisi yang diperintahkan dengan kondisi aktual.
Sebagai contoh, apabila katup diperintahkan terbuka tetapi sensor tidak mendeteksi pulsa aliran, sistem dapat memberikan peringatan bahwa suplai air perlu diperiksa. Namun, penyebabnya bisa berupa sumber air kosong, pompa tidak bekerja, pipa tersumbat, atau sensor mengalami kerusakan.
Dasar kimia dan material
Badan sensor YF-S201 pada varian umum menggunakan polimer, sedangkan rotor, poros, magnet, dan segelnya menggunakan material yang berbeda menurut produsen. Polimer dipilih karena relatif ringan, mudah dibentuk, dan dapat tahan terhadap korosi tertentu. Magnet menyediakan medan magnet yang dideteksi oleh elemen Hall.
Elemen Hall biasanya dibuat menggunakan semikonduktor. Ketika arus listrik mengalir melalui elemen yang berada dalam medan magnet, timbul tegangan Hall yang dapat digunakan untuk mendeteksi perubahan posisi magnet pada rotor.
Alasan pemilihan untuk RIMBARA
YF-S201 cocok untuk tahap prototipe karena relatif sederhana dan ekonomis. Namun, sensor ini perlu diuji terhadap air yang mengandung partikel tanah atau sedimen. Rotor dapat terganggu oleh kotoran, sehingga sensor mungkin membutuhkan penyaring dan prosedur pembersihan. Jika akan digunakan dalam kondisi lapangan yang berat, sensor aliran yang dirancang untuk media berlumpur atau aplikasi industri perlu dipertimbangkan.
Daftar pustaka

Referensi 12 — Baterai Litium-Ion dan Sistem Pengelolaan Daya
Tautan sumber: [Battery University — How do lithium-ion batteries work?](https://batteryuniversity.com/article/bu-205-types-of-lithium-ion?utm_source=chatgpt.com)
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa baterai litium-ion tersedia dalam berbagai jenis kimia dengan karakteristik tegangan, kapasitas, kepadatan energi, dan ketahanan termal yang berbeda. Oleh sebab itu, istilah baterai 18650 menunjukkan bentuk fisik sel silinder, bukan satu komposisi kimia tertentu.
Kaitannya dengan komponen RIMBARA
Baterai digunakan untuk memasok energi kepada mikrokontroler, sensor, dan sistem komunikasi. Karena RIMBARA dirancang untuk pemantauan lapangan, sumber daya harus mampu mendukung operasi sesuai target durasi dan frekuensi pengiriman data.
Kapasitas baterai perlu dihitung berdasarkan arus rata-rata perangkat dan waktu operasi yang diinginkan. Konsumsi energi katup solenoid atau pompa juga perlu diperhitungkan apabila keduanya menggunakan baterai yang sama.
Dasar kimia secara rinci
Pada baterai litium-ion, energi disimpan dan dilepaskan melalui reaksi elektrokimia yang melibatkan perpindahan ion litium di antara elektroda. Jenis material elektroda menentukan karakteristik sel. Beberapa sel menggunakan material katoda berbasis nikel, mangan, dan kobalt, sedangkan jenis lain menggunakan litium-besi-fosfat. Setiap jenis memiliki kelebihan dan keterbatasan yang berbeda.
Sel baterai harus dilengkapi dengan sistem proteksi yang sesuai untuk mengurangi risiko pengisian berlebih, pengosongan berlebih, dan arus berlebih. Pengelolaan temperatur juga penting karena baterai dapat mengalami penurunan kinerja atau kondisi berbahaya ketika terpapar panas berlebihan.
Alasan pemilihan untuk RIMBARA
Sel 18650 dapat menjadi pilihan prototipe karena formatnya ringkas dan tersedia dalam beragam kapasitas. Akan tetapi, pemilihan harus didasarkan pada spesifikasi sel yang jelas, bukan hanya ukuran fisiknya. Baterai juga perlu ditempatkan terpisah dari titik pengukuran suhu tinggi.

Referensi 13 — Nickel Institute, Stainless Steel: The Role of Nickel
Tautan sumber: https://nickelinstitute.org/en/nickel-applications/stainless-steel
Penjelasan isi sumber
Pada sumber ini dijelaskan bahwa baja tahan karat merupakan kelompok paduan berbasis besi yang memiliki ketahanan terhadap korosi. Kromium merupakan unsur utama yang berperan membentuk lapisan oksida pelindung pada permukaan, sedangkan nikel pada jenis baja tertentu membantu meningkatkan keuletan, kemampuan pembentukan, kemampuan pengelasan, dan karakteristik ketahanan korosi. 
Kaitannya dengan material RIMBARA
Baja tahan karat dapat digunakan untuk badan nozzle, fitting, serta selubung probe yang membutuhkan kekuatan mekanik dan ketahanan terhadap lingkungan lembap. Material ini relevan karena komponen RIMBARA akan terpapar air dan tanah, yang dapat mempercepat korosi pada logam tertentu.
Dasar kimia secara rinci
Ketika permukaan baja tahan karat terpapar oksigen, kromium membantu membentuk lapisan pasif yang kaya oksida kromium. Lapisan ini mengurangi laju reaksi lebih lanjut antara logam dan lingkungan.
Persamaan ideal yang menggambarkan pembentukan oksida kromium adalah:
\[ 4Cr+3O_2\rightarrow 2Cr_2O_3 \]
Persamaan ini merupakan representasi sederhana; lapisan pasif aktual memiliki struktur dan komposisi yang lebih kompleks.
Nikel berperan pada struktur dan sifat mekanik paduan, tetapi tidak berarti seluruh jenis baja tahan karat mempunyai ketahanan korosi yang sama. Lingkungan yang mengandung klorida dapat memicu korosi sumuran atau korosi celah pada grade tertentu.
Alasan pemilihan untuk RIMBARA
Stainless steel 304 dapat dievaluasi untuk badan nozzle dan komponen mekanis umum. Untuk lingkungan yang lebih agresif, grade lain seperti 316 dapat dipertimbangkan setelah mengevaluasi kondisi air, kandungan klorida, biaya, dan kebutuhan kekuatan.
Daftar pustaka
Nickel Institute. (n.d.). Stainless steel: The role of nickel. https://nickelinstitute.org/en/nickel-applications/stainless-steel
Nickel Institute. (n.d.). The nickel advantage. https://nickelinstitute.org/en/nickel-applications/stainless-steel/the-nickel-advantage

Tautan sumber: https://www.iec.ch/ip-ratings
Penjelasan isi sumber
Pada sumber ini dijelaskan konsep kode IP (Ingress Protection) yang digunakan untuk mengklasifikasikan tingkat perlindungan suatu selungkup terhadap masuknya benda padat dan air berdasarkan kondisi pengujian tertentu.
Kaitannya dengan material RIMBARA
Kompartemen elektronik RIMBARA harus melindungi ESP32, modul LoRa, konektor, dan rangkaian daya dari air serta debu. Tingkat perlindungan perlu dipilih berdasarkan kondisi pemasangan, kemungkinan perendaman, percikan air, dan metode perawatan perangkat.
Dasar material secara kimia
Selungkup dapat dibuat dari polimer teknik atau logam yang sesuai. Polimer dapat memberikan massa rendah dan ketahanan terhadap korosi tertentu, sedangkan logam dapat menawarkan kekuatan mekanik dan kemampuan pengelolaan panas. Namun, perlindungan air tidak ditentukan oleh bahan selungkup saja. Sambungan, gasket, kabel masuk, konektor, dan kualitas perakitan turut menentukan hasilnya.
Alasan pemilihan untuk RIMBARA
Target IP67 dapat dipertimbangkan jika desain memerlukan perlindungan terhadap debu dan perendaman sementara sesuai kondisi pengujian standar. Akan tetapi, label IP67 tidak membuktikan bahwa perangkat tahan terhadap temperatur tinggi, tekanan air yang tidak tercakup pengujian, atau seluruh kondisi kimia tanah gambut. Rakitan akhir harus diuji sesuai standar yang relevan.
Daftar pustaka

Referensi 15 — Parker Hannifin, O-Ring Handbook
Tautan sumber: [Parker Hannifin — O-Ring Handbook](https://www.parker.com/?utm_source=chatgpt.com)
Penjelasan isi sumber
Pada sumber ini tersedia panduan teknis mengenai pemilihan O-ring dan material penyekat untuk berbagai aplikasi. Pemilihan seal perlu mempertimbangkan temperatur, tekanan, kompatibilitas dengan fluida, deformasi, dan karakteristik mekanik material.
Kaitannya dengan material RIMBARA
O-ring atau gasket dapat digunakan pada sambungan badan nozzle, penutup kompartemen elektronik, dan fitting jalur air. Seal yang sesuai membantu mengurangi risiko kebocoran air ke kompartemen elektronik maupun kebocoran pada jalur distribusi.
Dasar kimia secara rinci
Karet silikon, EPDM, dan FKM merupakan contoh elastomer dengan struktur kimia dan karakteristik berbeda.
- Silikon:      memiliki rantai utama siloksana, yaitu ikatan berulang Si–O–Si. Material      ini dapat mempertahankan fleksibilitas pada rentang temperatur yang      relatif luas, bergantung pada grade.
- EPDM:      merupakan elastomer berbasis etilena, propilena, dan diena. Material ini      sering digunakan untuk aplikasi air dan cuaca, tetapi kompatibilitasnya      harus tetap diperiksa terhadap temperatur serta bahan kimia yang mungkin      terpapar.
- FKM:      merupakan keluarga elastomer berfluorin yang sering digunakan ketika      dibutuhkan ketahanan terhadap temperatur atau bahan kimia tertentu. Namun,      kesesuaiannya terhadap media dan kondisi operasi tetap bergantung pada      formulasi.
Alasan pemilihan untuk RIMBARA
Material seal tidak boleh dipilih hanya berdasarkan kelenturan. Seal harus sesuai dengan jenis air, tekanan, temperatur, dan bentuk sambungan. Uji kebocoran perlu dilakukan setelah perakitan untuk memastikan air tidak masuk ke kompartemen elektronik.

Parker Hannifin Corporation. (n.d.). O-ring handbook. https://www.parker.com/
Referensi 16 — Material PVC dan Polyurethane untuk Pipa serta Pelindung Kabel
Tautan sumber: [MatWeb — Material Property Data](https://www.matweb.com/?utm_source=chatgpt.com)
Penjelasan isi sumber
Pada sumber ini tersedia data sifat material yang dapat digunakan untuk membandingkan karakteristik mekanik dan fisik berbagai polimer. Data tersebut dapat mencakup kekuatan tarik, modulus elastisitas, temperatur penggunaan, serta karakteristik material lain sesuai entri yang tersedia.
Kaitannya dengan material RIMBARA
PVC dan polyurethane (PU) dapat dipertimbangkan untuk bagian pipa, selang, atau pelindung kabel yang tidak terpapar kondisi di luar batas spesifikasinya. Pemilihan polimer dapat mengurangi massa perangkat dan memudahkan pemasangan komponen fleksibel.
Dasar kimia secara rinci
PVC memiliki unit ulang polimer yang dapat direpresentasikan sebagai \((C_2H_3Cl)_n\). Ikatan pada rantai polimer memberikan sifat isolasi listrik yang bermanfaat pada sejumlah aplikasi kabel dan pipa. Formulasi PVC dapat dibuat lebih fleksibel melalui penambahan bahan tertentu.
Polyurethane memiliki gugus uretan pada rantai polimernya. Struktur dan formulasi PU dapat menghasilkan material yang tahan abrasi, fleksibel, atau mempunyai sifat mekanik tertentu sesuai jenis produk.
Alasan pemilihan untuk RIMBARA
PVC dapat dievaluasi untuk pipa atau saluran yang memenuhi batas temperatur dan tekanan, sedangkan PU dapat dipertimbangkan untuk selang fleksibel atau pelindung kabel tertentu. Namun, keduanya tidak boleh digunakan langsung pada titik bersuhu tinggi tanpa spesifikasi yang sesuai. Data dari MatWeb sebaiknya digunakan sebagai pembanding awal dan dikonfirmasi melalui datasheet produsen material yang akan dibeli.
Daftar pustaka
MatWeb. (n.d.). Material property data. https://www.matweb.com/</textarea>

    if(/^https?:\/\//.test(part)){
      const clean=part.replace(/[.,;:)]+$/,'');
      const tail=part.slice(clean.length);

  }).join('');
}
